name: Release desktop installers from a pinned candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  resolve-candidate:
    name: Resolve the immutable release candidate
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.candidate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: candidate
        shell: bash
        run: |
          set -eu
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo 'Release tag must start with v and a version number.' >&2; exit 2 ;; esac
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          source_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test -n "$source_commit"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  signing-readiness:
    name: Check signing material without exposing it
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.ready.outputs.macos }}
      windows: ${{ steps.ready.outputs.windows }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - id: ready
        shell: bash
        run: |
          set -eu
          macos=false
          windows=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then macos=true; fi
          if [ -n "$WINDOWS_CERT_PFX" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then windows=true; fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux x64
    needs: resolve-candidate
    runs-on: ubuntu-latest
    env:
      VITE_BUILD_ID: ${{ needs.resolve-candidate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils
      - run: npm ci
      - name: Build Linux installers from the pinned candidate
        run: npm run tauri build -- --bundles appimage,deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: [resolve-candidate, signing-readiness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    env:
      VITE_BUILD_ID: ${{ needs.resolve-candidate.outputs.source_commit }}
      MACOS_SIGNED: ${{ needs.signing-readiness.outputs.macos }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Import signing certificate
        if: needs.signing-readiness.outputs.macos == 'true'
        shell: bash
        run: |
          set -eu
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - run: npm ci
      - name: Build macOS installer from the pinned candidate
        shell: bash
        run: |
          set -eu
          if [ "$MACOS_SIGNED" = true ]; then
            node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p));c.bundle.macOS={...(c.bundle.macOS||{}),signingIdentity:process.env.APPLE_SIGNING_IDENTITY};fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n")'
          fi
          npm run tauri build -- --target "${{ matrix.target }}" --bundles dmg
      - name: Notarize and verify signed disk images
        if: needs.signing-readiness.outputs.macos == 'true'
        shell: bash
        run: |
          set -eu
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY" | base64 --decode > "$KEY_PATH"
          find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name '*.app' -print0 | while IFS= read -r -d '' app; do codesign --verify --deep --strict --verbose=2 "$app"; done
          find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print0 | while IFS= read -r -d '' dmg; do
            xcrun notarytool submit "$dmg" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows x64
    needs: [resolve-candidate, signing-readiness]
    runs-on: windows-latest
    env:
      VITE_BUILD_ID: ${{ needs.resolve-candidate.outputs.source_commit }}
      WINDOWS_SIGNED: ${{ needs.signing-readiness.outputs.windows }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Build Windows installers from the pinned candidate
        run: npm run tauri build -- --bundles msi,nsis
      - name: Authenticode-sign and verify every installer
        if: needs.signing-readiness.outputs.windows == 'true'
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $installers = Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -Include *.msi,*.exe
          if ($installers.Count -eq 0) { throw 'No Windows installer was built.' }
          foreach ($installer in $installers) {
            $arguments = @('sign', '/fd', 'SHA256', '/f', $certificate, '/p', $env:WINDOWS_CERT_PASSWORD)
            if ($env:WINDOWS_TIMESTAMP_URL) { $arguments += @('/tr', $env:WINDOWS_TIMESTAMP_URL, '/td', 'SHA256') }
            $arguments += $installer.FullName
            & signtool @arguments
            if ($LASTEXITCODE -ne 0) { throw "Could not sign $($installer.Name)" }
            & signtool verify /pa /all /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($installer.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  publish:
    name: Publish checksummed desktop assets
    needs: [resolve-candidate, signing-readiness, build-linux, build-macos, build-windows]
    if: >-
      always() && needs.resolve-candidate.result == 'success' &&
      needs.build-linux.result == 'success' && needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ needs.resolve-candidate.outputs.source_commit }}
      MACOS_SIGNED: ${{ needs.signing-readiness.outputs.macos }}
      WINDOWS_SIGNED: ${{ needs.signing-readiness.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-candidate.outputs.source_commit }}
          fetch-depth: 0
      - name: Confirm this tag names the pinned candidate
        shell: bash
        run: |
          set -eu
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$tag_commit" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Build a complete, verifiable manifest
        run: |
          set -eu
          sh scripts/build-release-manifest.sh release-assets "$RELEASE_TAG" "$SOURCE_COMMIT" "$MACOS_SIGNED" "$WINDOWS_SIGNED"
          (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Write release provenance
        shell: bash
        run: |
          set -eu
          {
            echo "Source commit: $SOURCE_COMMIT"
            if [ "$MACOS_SIGNED" = true ]; then echo 'macOS signing: verified and notarized'; else echo 'macOS signing: unsigned (operator certificate unavailable)'; fi
            if [ "$WINDOWS_SIGNED" = true ]; then echo 'Windows signing: verified'; else echo 'Windows signing: unsigned (operator certificate unavailable)'; fi
            echo
            echo 'SHA256SUMS and latest.json describe every published asset. Unsigned packages are labelled as unsigned; no signature is claimed for them.'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Local Data Workbench ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: release-assets/*
