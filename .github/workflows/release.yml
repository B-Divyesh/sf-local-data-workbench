name: Release desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ''
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            files: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - label: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            files: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            files: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils
      - run: npm ci
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - name: Attach platform artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Local Data Workbench ${{ env.RELEASE_TAG }}
          body: |
            First public preview. All processing is local. Builds are unsigned; see the download page for platform-specific opening instructions.
          files: ${{ matrix.files }}
          fail_on_unmatched_files: false

  manifest:
    name: Publish checksums and manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --repo "$GITHUB_REPOSITORY"
      - name: Build SHA256SUMS and latest.json
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS latest.json
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          linux_file="$(find . -maxdepth 1 -name '*.AppImage' -printf '%f\n' | head -n1)"
          windows_file="$(find . -maxdepth 1 \( -name '*.msi' -o -name '*.exe' \) -printf '%f\n' | head -n1)"
          arm_file="$(find . -maxdepth 1 -iname '*aarch64*.dmg' -printf '%f\n' | head -n1)"
          x64_file="$(find . -maxdepth 1 -name '*.dmg' ! -iname '*aarch64*' -printf '%f\n' | head -n1)"
          test -n "$linux_file" && test -n "$windows_file" && test -n "$arm_file" && test -n "$x64_file"
          asset_json() { file="$1"; hash="$(sha256sum "$file" | cut -d' ' -f1)"; encoded="$(jq -rn --arg value "$file" '$value|@uri')"; jq -n --arg name "$file" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$encoded" --arg sha256 "$hash" '{name:$name,url:$url,sha256:$sha256}'; }
          jq -n --arg version "$RELEASE_TAG" --argjson linux "$(asset_json "$linux_file")" --argjson windows "$(asset_json "$windows_file")" --argjson arm "$(asset_json "$arm_file")" --argjson x64 "$(asset_json "$x64_file")" '{version:$version,platforms:{linux:$linux,windows:$windows,"mac-arm64":$arm,"mac-x64":$x64}}' > latest.json
          jq empty latest.json
      - name: Attach verification files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
