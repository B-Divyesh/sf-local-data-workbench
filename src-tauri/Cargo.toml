[package]
name = "local-data-workbench"
version = "0.1.6"
description = "Private, reproducible local file transformations"
authors = ["Sociobot"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-local-data-workbench"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_data_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[[bin]]
name = "local-data-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
csv = "1.3.1"
flate2 = "1.1"
parquet = { version = "56.1.0", default-features = false, features = ["snap", "flate2", "flate2-rust_backened", "lz4", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.8.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.4.0", optional = true }
tauri-plugin-opener = { version = "2.5.0", optional = true }

[dev-dependencies]
tempfile = "3.21"
